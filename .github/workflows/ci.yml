name: CI

on:
  push:
    branches: [ develop, main, '**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build:
    name: Build and Test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install SoftHSM2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y softhsm2
          softhsm2-util --init-token --slot 0 --label CI --pin 1234 --so-pin 0000

      - name: Build without tests
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Run tests (standard)
        run: mvn -B test --no-transfer-progress

      - name: Run tests with SoftHSM2 (pkcs11-ci profile)
        run: mvn -B test -Ppkcs11-ci --no-transfer-progress
        env:
          SOFTHSM2_CONF: /etc/softhsm/softhsm2.conf

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
