# Quarkus datasource — Apache Derby (embedded JavaDB)
quarkus.datasource.db-kind=derby
quarkus.datasource.jdbc.url=jdbc:derby:${quarkus.profile:}basis-consumer-db;create=true
quarkus.datasource.username=basis
quarkus.datasource.password=basis

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Application port
quarkus.http.port=8080

# Health
quarkus.health.openapi.included=true

# Hawtio JMX management console
quarkus.hawtio.authenticationEnabled=false
