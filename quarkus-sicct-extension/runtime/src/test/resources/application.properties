quarkus.datasource.db-kind=derby
quarkus.datasource.jdbc.url=jdbc:derby:memory:sicct-test-db;create=true
quarkus.datasource.username=test
quarkus.datasource.password=test
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.http.test-port=0

# Disable periodic discovery in unit tests (no real network / UDP port available)
sicct.discovery.enabled=false
