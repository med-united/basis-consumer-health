# Bind a random free port for @QuarkusTest so parallel module builds don't collide on 8081
quarkus.http.test-port=0
quarkus.http.test-ssl-port=0

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:siccttest;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
