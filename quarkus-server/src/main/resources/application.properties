quarkus.cxf.path=/ws
# ─── CXF JMX management + response-time performance counters ──────────────────
# CxfJmxPerformanceFeature enables the CXF InstrumentationManager (platform MBean server, so it is
# visible in Hawtio) and a CounterRepository that records per-service/per-operation response-time
# counters (NumInvocations, AvgResponseTime, Min/MaxResponseTime, TotalHandlingTime, ...).
# The feature configures the bus once; it is listed on every endpoint so JMX is enabled before the
# first endpoint starts (that is when each endpoint's MBean registers). MBeans appear under the
# "org.apache.cxf" JMX domain.
quarkus.cxf.endpoint."/conn/EventService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/conn/CardService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/conn/CardTerminalService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/conn/CertificateService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/conn/AuthSignatureService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/conn/SignatureService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/conn/EncryptionService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/conn/VSDService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/consumer/CertificateService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/consumer/EncryptionService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
quarkus.cxf.endpoint."/consumer/SignatureService".features=de.servicehealtherx.quarkus.jmx.CxfJmxPerformanceFeature
# ─── Hawtio JMX Management UI ────────────────────────────────────────────────
# Dev: Hawtio accessible without login (no security extension required)
%dev.quarkus.hawtio.authenticationEnabled=false
# Production: authenticate via OIDC
%prod.quarkus.hawtio.authenticationEnabled=true
# ─── OIDC (production only) ──────────────────────────────────────────────────
# Dev: disable OIDC so no IdP is required during local development.
# quarkus.oidc.enabled is a BUILD-TIME property: it is frozen into the runner jar at
# package time (which uses the prod profile), so a prod-built jar launched later with
# -Dquarkus.profile=dev keeps OIDC enabled and then fails at boot demanding an
# auth-server-url. quarkus.oidc.tenant-enabled is a RUNTIME property, so also disable the
# default tenant in dev — this lets the packaged runner jar boot self-contained under the
# dev profile (e.g. the SICCT pairing system test) without any IdP.
%dev.quarkus.oidc.enabled=false
%dev.quarkus.oidc.tenant-enabled=false
# Production: set these environment variables in the deployment:
#   OIDC_AUTH_SERVER_URL  — e.g. https://keycloak.example.com/realms/ti
#   OIDC_CLIENT_ID        — defaults to "hawtio"
#   OIDC_CLIENT_SECRET    — client secret from the IdP
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:hawtio}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
%prod.quarkus.oidc.application-type=web-app
# Restrict Hawtio to authenticated users in production
%prod.quarkus.http.auth.permission.hawtio.paths=/hawtio/*
%prod.quarkus.http.auth.permission.hawtio.policy=authenticated
# ─── Persistence (H2) ────────────────────────────────────────────────────────
# The konnektor persists CardTerminal pairings (paired secret), CETP subscriptions,
# G2 card logs and AppConfigProperty rows. db-kind and the schema-management strategy are
# BUILD-TIME properties: they must be baked into the runner jar here (passing them with -D
# at launch is silently ignored). Without them the packaged jar boots against an empty,
# schema-less database and fails (e.g. "Tabelle CETP_SUBSCRIPTION nicht gefunden").
# In dev, Quarkus dev-services would otherwise supply an ephemeral H2; naming the datasource
# explicitly keeps dev and the packaged jar consistent. The jdbc.url is a RUNTIME property
# and is overridable (the system tests point it at an in-memory DB).
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:${KONNEKTOR_DB_PATH:./data/konnektor};DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
# update (not drop-and-create): preserve persisted pairings/subscriptions across restarts
# while creating any missing tables on first boot.
quarkus.hibernate-orm.database.generation=update
crypto.provider.p12.enabled=false
quarkus.crypto.p12.certs-dir=certs
# Keep test-generated mTLS material out of the repo root (under target/).
%test.quarkus.crypto.p12.certs-dir=target/mtls-test-certs
# ─── PC/SC reader crypto service ─────────────────────────────────────────────
# Drives directly-connected PC/SC smartcard readers (HBA/SMC-B/eGK) and contributes
# their cards to the unified GetCards view. Set to false to remove the provider and its
# JMX PIN-verifier entirely — no reader-polling thread starts. Build-time property:
# a rebuild/redeploy applies the change. Enabled by default.
crypto.provider.pcsc.enabled=false
# ─── VSDM ReadVSD ────────────────────────────────────────────────────────────
# Hard upper bound for a single local ReadVSD (card-bound); on expiry the operation
# aborts with a fault and releases the eGK reservation (FR-027, MAXTIME_VSDM).
vsdm.read.timeout-ms=30000
# ─── connector.sds Dienstverzeichnisdienst (gemSpec_Kon 4.1.3) ───────────────
# Served at GET /connector.sds. Endpoint/WSDL URLs are derived from the incoming
# request; set connector.sds.base-url to the externally reachable TLS base
# (scheme://host[:port]) when behind a TLS-terminating proxy, e.g.
#   connector.sds.base-url=https://konnektor.example.com
#connector.sds.base-url=https://konnektor.example.com
connector.sds.tls-mandatory=true
connector.sds.client-aut-mandatory=true
# ProductInformation block (respects the ServiceDirectory.xsd pattern/length limits):
connector.sds.product.type=Konnektor
connector.sds.product.type-version=5.27.0
connector.sds.product.vendor-id=SHRX
connector.sds.product.code=BCHCONN
connector.sds.product.version=1.0.0
connector.sds.product.vendor-name=ServiceHealtheRX
connector.sds.product.name=Basis Consumer Health Konnektor
# ─── LDAP-Proxy (gemSpec_Basis_Consumer 4.2 / 6.4) ───────────────────────────
# Exposes an LDAPv3 client-system interface (Bind/Unbind/Search/Abandon per A_17341-01)
# and proxies the operations to the Verzeichnisdienst der TI-Plattform (VZD) over LDAPS.
# Disabled by default; set enabled=true and configure the VZD host to start it.
ldap.proxy.enabled=false
ldap.proxy.port=1389
ldap.proxy.vzd.port=636
ldap.proxy.vzd.use-ssl=true
# ldap.proxy.vzd.host=vzd.prod.ccs.gematik.solutions
# Dev only: skip TI certificate validation for the LDAPS upstream (NEVER in production).
%dev.ldap.proxy.vzd.trust-all=true
# ─── APDU hex tracing ────────────────────────────────────────────────────────
# Logs every command/response APDU in hex (de.servicehealtherx.apdu.card.transport.ApduTrace).
# DEBUG is the JBoss LogManager equivalent of JUL FINE; the console handler (default level ALL)
# emits it once the category is lowered. PINs are masked, but certificate/personal data is logged
# in full — so tracing is enabled for the dev profile only.
%dev.quarkus.log.category."de.servicehealtherx.apdu.trace".level=DEBUG
# To trace in production too, add (uncommented, without the %dev prefix):
#quarkus.log.category."de.servicehealtherx.apdu.trace".level=DEBUG
vsdm.c2c.enabled=true
# ─── mTLS client authentication for the webservices ──────────────────────────
# The server runs a self-managed PKI: MtlsMain (@QuarkusMain) generates
# certs/mtls/{ca,server,truststore}.p12 *before* Quarkus boots, so the TLS
# registry bucket below finds them. The MtlsCertManagement JMX bean (Hawtio,
# domain de.servicehealtherx, name=MtlsCertManagement) issues client certificates
# against the self-signed root CA (signCsr / createP12 / createP12File).
#
# Scoped to %prod (the packaged runner jar's default profile) so dev mode and the
# @QuarkusTest suites keep booting over plain HTTP. Override the password and the
# server certificate CN via env: MTLS_KEYSTORE_PASSWORD, MTLS_SERVER_CN (these must
# match between the @QuarkusMain bootstrap and the config below).
mtls.keystore.password=${MTLS_KEYSTORE_PASSWORD:changeit}
mtls.server.cn=${MTLS_SERVER_CN:localhost}
# Server TLS identity (leaf issued by the root CA) and the CA trust store against
# which presented client certificates are validated.
%prod.quarkus.tls.mtls.key-store.p12.path=${MTLS_CERTS_DIR:certs}/mtls/server.p12
%prod.quarkus.tls.mtls.key-store.p12.password=${MTLS_KEYSTORE_PASSWORD:changeit}
%prod.quarkus.tls.mtls.trust-store.p12.path=${MTLS_CERTS_DIR:certs}/mtls/truststore.p12
%prod.quarkus.tls.mtls.trust-store.p12.password=${MTLS_KEYSTORE_PASSWORD:changeit}
# REQUEST: a presented client certificate is validated against the CA trust store,
# but clients presenting none are still accepted (keeps Hawtio/OIDC/UI5/health
# reachable). Switch to REQUIRED to reject any connection without a trusted cert.
%prod.quarkus.tls.mtls.client-auth=REQUEST
%prod.quarkus.http.tls-configuration-name=mtls
%prod.quarkus.http.ssl-port=8443
# Force all traffic onto TLS: plain-HTTP requests are redirected to the HTTPS port.
%prod.quarkus.http.insecure-requests=redirect
