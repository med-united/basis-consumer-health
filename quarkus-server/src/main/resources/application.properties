quarkus.cxf.path=/ws
# ─── Hawtio JMX Management UI ────────────────────────────────────────────────
# Dev: Hawtio accessible without login (no security extension required)
%dev.quarkus.hawtio.authenticationEnabled=false
# Production: authenticate via OIDC
%prod.quarkus.hawtio.authenticationEnabled=true
# ─── OIDC (production only) ──────────────────────────────────────────────────
# Dev: disable OIDC so no IdP is required during local development
%dev.quarkus.oidc.enabled=false
# Production: set these environment variables in the deployment:
#   OIDC_AUTH_SERVER_URL  — e.g. https://keycloak.example.com/realms/ti
#   OIDC_CLIENT_ID        — defaults to "hawtio"
#   OIDC_CLIENT_SECRET    — client secret from the IdP
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.client-id=${OIDC_CLIENT_ID:hawtio}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
%prod.quarkus.oidc.application-type=web-app
# Restrict Hawtio to authenticated users in production
%prod.quarkus.http.auth.permission.hawtio.paths=/hawtio/*
%prod.quarkus.http.auth.permission.hawtio.policy=authenticated
quarkus.crypto.p12.certs-dir=certs
