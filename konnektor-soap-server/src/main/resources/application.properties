# Quarkus datasource — Apache Derby (embedded JavaDB)
quarkus.datasource.db-kind=derby
quarkus.datasource.jdbc.url=jdbc:derby:${quarkus.profile:}konnektor-db;create=true
quarkus.datasource.username=basis
quarkus.datasource.password=basis

# Hibernate ORM
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false

# Application port
quarkus.http.port=8081

# Index internal library JARs so Quarkus CDI discovers their @ApplicationScoped beans
quarkus.index-dependency.crypto-services-lib.group-id=de.servicehealtherx
quarkus.index-dependency.crypto-services-lib.artifact-id=crypto-services-lib
quarkus.index-dependency.crypto-lib.group-id=de.servicehealtherx
quarkus.index-dependency.crypto-lib.artifact-id=crypto-lib
quarkus.index-dependency.quarkus-sicct-extension.group-id=de.servicehealtherx
quarkus.index-dependency.quarkus-sicct-extension.artifact-id=quarkus-sicct-extension
quarkus.index-dependency.sicct-lib.group-id=de.servicehealtherx
quarkus.index-dependency.sicct-lib.artifact-id=sicct-lib

# Health
quarkus.health.openapi.included=true
