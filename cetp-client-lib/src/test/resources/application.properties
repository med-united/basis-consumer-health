# Test datasource for Subscription / ClientEndpoint JPA entities (H2 in-memory)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cetp;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create

# CETP configuration defaults (research.md D6)
cetp.evt-max-try=3
cetp.tls.mandatory=false
cetp.delivery.timeout-ms=2000
# cetp.tls.truststore.path / cetp.tls.truststore.password are left unset here; the mTLS tests
# build CetpTlsContextFactory with an explicit trust store. An explicitly empty value would fail
# SmallRye Config conversion, so these keys are intentionally absent.
